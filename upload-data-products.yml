name: Upload Data Products

# Trigger: when spec files in podem/ are changed on main
on:
  push:
    branches:
      - main
    paths:
      - 'podem/**/*.odps.yaml'
      - 'podem/**/*.odcs.yaml'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository (with history to detect changed files)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Check out the uploader tool (public repo)
      - name: Checkout uploader
        uses: actions/checkout@v4
        with:
          repository: jgperrin/ai.jgp.gha.data-product-uploader
          path: uploader

      - name: Build uploader
        run: mvn -q -f uploader/pom.xml clean package

      # 4. Find changed product files and upload each one
      - name: Upload changed products
        env:
          ZEENEA_API_KEY: ${{ secrets.ZEENEA_API_KEY }}
          ZEENEA_TENANT: ${{ secrets.ZEENEA_TENANT }}
          ZEENEA_URL: ${{ secrets.ZEENEA_URL }}
          ZEENEA_CATALOG: ${{ secrets.ZEENEA_CATALOG }}
          KAFKA_BROKER_URL: ${{ secrets.KAFKA_BROKER_URL }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
        run: |
          # Find .odps.yaml files changed in the last commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'podem/**/*.odps.yaml')

          if [ -z "$CHANGED" ]; then
            echo "No product files changed, nothing to upload."
            exit 0
          fi

          echo "Changed product files:"
          echo "$CHANGED"
          echo ""

          FAIL=0
          for PRODUCT in $CHANGED; do
            echo "=========================================="
            echo "Processing: $PRODUCT"
            echo "=========================================="
            java -jar uploader/target/data-product-uploader-*.jar \
              --file "$PRODUCT" || FAIL=1
            echo ""
          done

          exit $FAIL
