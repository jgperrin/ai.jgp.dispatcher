name: Upload Data Products

# Trigger: on push to spec files, or manually via workflow_dispatch
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'podem/**/*.odps.yaml'
      - 'podem/**/*.odcs.yaml'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository (full history + tags for versioned contract retrieval)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 2. Set up Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Check out the uploader tool (public repo)
      - name: Checkout uploader
        uses: actions/checkout@v4
        with:
          repository: jgperrin/ai.jgp.dispatcher
          path: uploader

      - name: Build uploader
        run: mvn -q -f uploader/pom.xml clean package

      # 4. Upload changed products (git diff + smart ZIP building handled in Java)
      - name: Upload changed products
        env:
          ZEENEA_API_KEY: ${{ secrets.ZEENEA_API_KEY }}
          ZEENEA_TENANT: ${{ secrets.ZEENEA_TENANT }}
          ZEENEA_URL: ${{ secrets.ZEENEA_URL }}
          ZEENEA_CATALOG: ${{ secrets.ZEENEA_CATALOG }}
          KAFKA_BROKER_URL: ${{ secrets.KAFKA_BROKER_URL }}
          KAFKA_USERNAME: ${{ secrets.KAFKA_USERNAME }}
          KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
          X_ORG_ID: ${{ secrets.X_ORG_ID }}
        run: java -jar uploader/target/data-product-uploader-*.jar --dir podem
